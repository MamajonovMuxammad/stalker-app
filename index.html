<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STALKER — Карта объектов Ташкента и Узбекистана</title>
  <meta name="description" content="Интерактивная карта заброшенных, исторических и засекреченных объектов Ташкента и Узбекистана. Исследуй, добавляй, делись.">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/img/stalker-logo.jpg">
  <link rel="shortcut icon" href="/favicon.jpg">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="site-header">
    <nav class="navbar">
      <a href="/" class="navbar-brand" aria-label="STALKER — На главную">
        <div class="brand-icon"><img src="/img/stalker-logo.jpg" alt="STALKER" class="brand-logo-img"></div>
        <span class="brand-name">STALK<span>ER</span></span>
      </a>

      <div class="navbar-nav">
        <a href="/" class="nav-link active" id="nav-map">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6-10l6-3m6 13l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-1.447-.894L15 9m0 8V9"/></svg>
          Карта
        </a>
        <a href="/catalog.html" class="nav-link" id="nav-catalog">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Каталог
        </a>
        <a href="/submit.html" class="nav-link" id="nav-submit">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          Добавить объект
        </a>
        <a href="/admin.html" class="nav-link" id="nav-admin" style="display:none;">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Модерация
        </a>
      </div>

      <div class="navbar-actions">
        <a href="/auth.html" class="btn btn-ghost btn-sm" id="btn-login" style="display:none;">Войти</a>
        <a href="/auth.html?mode=register" class="btn btn-primary btn-sm" id="btn-register" style="display:none;">Регистрация</a>
        <div class="dropdown" id="user-dropdown" style="display:none;">
          <button class="avatar-btn" id="avatar-trigger" aria-label="Меню пользователя">
            <span id="avatar-letter">U</span>
          </button>
          <div class="dropdown-menu" id="user-menu">
            <div style="padding: 12px 16px; border-bottom: 1px solid var(--border);">
              <div style="font-size:var(--text-sm); font-weight:600; color:var(--text-primary);" id="menu-username">Пользователь</div>
              <div style="font-size:var(--text-xs); color:var(--text-tertiary); margin-top:2px;" id="menu-role">Следопыт</div>
            </div>
            <a href="/submit.html" class="dropdown-item">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
              Добавить объект
            </a>
            <button class="dropdown-item danger" id="btn-logout">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Выйти
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile Hamburger Button -->
      <button class="burger-btn" id="burger-toggle-btn" aria-label="Меню навигации">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <!-- Mobile Navigation Drawer -->
  <div class="mobile-drawer-backdrop" id="mobile-drawer-backdrop"></div>
  <aside class="mobile-nav-drawer" id="mobile-nav-drawer" aria-label="Мобильное меню">
    <div class="mobile-drawer-header">
      <a href="/" class="navbar-brand">
        <div class="brand-icon"><img src="/img/stalker-logo.jpg" alt="STALKER" class="brand-logo-img"></div>
        <span class="brand-name">STALK<span>ER</span></span>
      </a>
      <button class="mobile-drawer-close" id="mobile-drawer-close" aria-label="Закрыть меню">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="mobile-drawer-user" id="mobile-drawer-user">
      <!-- Injected by JS -->
    </div>

    <nav class="mobile-drawer-nav">
      <a href="/" class="mobile-nav-link active" id="mob-nav-map">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6-10l6-3m6 13l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-1.447-.894L15 9m0 8V9"/></svg>
        <span>Карта объектов</span>
      </a>
      <a href="/catalog.html" class="mobile-nav-link" id="mob-nav-catalog">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Каталог локаций</span>
      </a>
      <a href="/submit.html" class="mobile-nav-link" id="mob-nav-submit">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Добавить объект</span>
      </a>
      <a href="/admin.html" class="mobile-nav-link" id="mob-nav-admin" style="display:none;">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Модерация и Радар</span>
        <span class="badge accent" style="margin-left:auto; font-size:10px;">СБ</span>
      </a>
    </nav>

    <div class="mobile-drawer-footer" id="mobile-drawer-footer">
      <!-- Injected by JS -->
    </div>
  </aside>

  <!-- MAP PAGE -->
  <div class="map-page" id="map-page" role="main">

    <!-- Mobile Backdrop for Sidebar -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar (CLOSED by default: has 'collapsed') -->
    <aside class="map-sidebar collapsed" id="map-sidebar" aria-label="Объекты на карте">
      <div class="map-sidebar-header">
        <div style="margin-bottom: var(--sp-4);">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: var(--sp-3);">
            <h1 style="font-size: var(--text-md); font-weight: 700; letter-spacing: -0.01em;">Объекты</h1>
            <span class="badge" id="sidebar-count">0</span>
          </div>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="search" class="input" id="sidebar-search" placeholder="Поиск объекта..." style="font-size:var(--text-sm); height:38px; padding-left:42px; border-radius:20px; background:var(--bg-base);">
          </div>
        </div>
        <div class="chip-bar" id="sidebar-filters">
          <button class="chip active" data-filter="all">Все</button>
          <button class="chip" data-filter="bunker">Бункеры</button>
          <button class="chip" data-filter="abandoned">Заброшки</button>
          <button class="chip" data-filter="underground">Подземка</button>
        </div>
      </div>

      <div class="map-sidebar-content" id="sidebar-list">
        <!-- populated by JS -->
      </div>

      <div class="map-sidebar-footer" id="sidebar-user-block">
        <!-- user info -->
      </div>
    </aside>

    <!-- Map itself -->
    <div class="map-main">
      <!-- Floating Sidebar Toggle Button -->
      <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Открыть список объектов" title="Список объектов">
        <svg class="sidebar-toggle-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
        <span class="sidebar-toggle-text">Объекты</span>
      </button>

      <div id="map"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- App JS -->
  <script src="/js/data.js"></script>
  <script src="/js/map.js"></script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
