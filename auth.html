<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация — STALKER</title>
  <meta name="description" content="Авторизация в STALKER — платформе для исследователей заброшенных объектов Узбекистана.">

  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="site-header">
    <nav class="navbar">
      <a href="/" class="navbar-brand">
        <div class="brand-icon">S</div>
        <span class="brand-name">STALK<span>ER</span></span>
      </a>
      <div class="navbar-actions" style="margin-left:auto;">
        <a href="/" class="btn btn-ghost btn-sm">← На карту</a>
      </div>
    </nav>
  </header>

  <!-- AUTH PAGE -->
  <div class="page-wrapper">
    <div class="auth-page" role="main">
      <div class="auth-card">

        <!-- Card Header -->
        <div class="auth-card-header">
          <div class="auth-logo">S</div>
          <h1 style="font-size:var(--text-xl); font-weight:800; letter-spacing:-0.02em; margin-bottom:var(--sp-1);" id="auth-title">Войдите в аккаунт</h1>
          <p style="font-size:var(--text-sm); color:var(--text-secondary);" id="auth-desc">Добро пожаловать обратно</p>
        </div>

        <!-- Mode toggle (tabs) -->
        <div style="padding: var(--sp-5) var(--sp-8) 0;">
          <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchMode('login')">Вход</button>
            <button class="auth-tab" id="tab-register" onclick="switchMode('register')">Регистрация</button>
          </div>
        </div>

        <!-- Form -->
        <form id="auth-form" novalidate>
          <div class="auth-card-body">

            <!-- Username -->
            <div class="form-group">
              <label class="form-label" for="auth-username">
                Логин или email <span class="required">*</span>
              </label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </span>
                <input
                  type="text"
                  id="auth-username"
                  class="input"
                  placeholder="tracker_89"
                  required
                  autocomplete="username"
                  style="padding-left:42px;"
                />
              </div>
              <div class="form-error" id="err-username" style="display:none;"></div>
            </div>

            <!-- Callsign (register only) -->
            <div class="form-group register-only" style="display:none;">
              <label class="form-label" for="auth-callsign">Позывной</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                </span>
                <input
                  type="text"
                  id="auth-callsign"
                  class="input"
                  placeholder="СЕВЕР-4"
                  autocomplete="nickname"
                  style="padding-left:42px;"
                />
              </div>
            </div>

            <!-- Email (register only) -->
            <div class="form-group register-only" style="display:none;">
              <label class="form-label" for="auth-email">Email</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </span>
                <input
                  type="email"
                  id="auth-email"
                  class="input"
                  placeholder="you@example.com"
                  autocomplete="email"
                  style="padding-left:42px;"
                />
              </div>
              <div class="form-error" id="err-email" style="display:none;"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label class="form-label" for="auth-password">
                Пароль <span class="required">*</span>
              </label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                </span>
                <input
                  type="password"
                  id="auth-password"
                  class="input"
                  placeholder="••••••••"
                  required
                  autocomplete="current-password"
                  style="padding-left:42px;"
                />
              </div>
              <div class="form-error" id="err-password" style="display:none;"></div>
            </div>

            <!-- Captcha -->
            <div class="form-group">
              <label class="form-label">Проверочный код</label>
              <div class="captcha-widget">
                <div class="captcha-display">
                  <canvas id="captcha-canvas" class="captcha-canvas" width="160" height="52" aria-label="Captcha"></canvas>
                  <button type="button" class="captcha-refresh" id="captcha-refresh" title="Обновить код">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                  </button>
                </div>
                <input
                  type="text"
                  id="auth-captcha"
                  class="input"
                  placeholder="Введите код"
                  maxlength="5"
                  style="text-transform:uppercase; letter-spacing:0.15em; font-weight:600;"
                  required
                />
              </div>
              <div class="form-error" id="err-captcha" style="display:none;"></div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary btn-lg btn-block" id="auth-submit-btn">
              Войти
            </button>

            <!-- Demo credentials -->
            <div style="padding: var(--sp-4); background: var(--bg-base); border-radius: 8px; border: 1px solid var(--border);">
              <p style="font-size:var(--text-xs); color:var(--text-tertiary); line-height:1.8;">
                <strong style="color:var(--text-secondary);">Тестовые аккаунты:</strong><br>
                Администратор: <code style="color:var(--accent);">commander</code> / <code style="color:var(--accent);">stalker1986</code><br>
                Пользователь: <code style="color:var(--accent);">tracker_89</code> / <code style="color:var(--accent);">stalker1986</code>
              </p>
            </div>

          </div>
        </form>

      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="/js/data.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    function switchMode(mode) {
      const isRegister = mode === 'register';
      document.getElementById('tab-login').classList.toggle('active', !isRegister);
      document.getElementById('tab-register').classList.toggle('active', isRegister);
      document.querySelectorAll('.register-only').forEach(el => el.style.display = isRegister ? 'flex' : 'none');
      document.getElementById('auth-title').textContent = isRegister ? 'Создать аккаунт' : 'Войдите в аккаунт';
      document.getElementById('auth-desc').textContent = isRegister ? 'Присоединяйтесь к сообществу исследователей' : 'Добро пожаловать обратно';
      document.getElementById('auth-submit-btn').textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
      // update mode for auth.js
      if (window.setAuthMode) window.setAuthMode(mode);
    }
  </script>
</body>
</html>
