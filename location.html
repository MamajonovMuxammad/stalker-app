<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Объект — STALKER</title>
  <meta name="description" content="Подробное досье объекта на карте STALKER — заброшенные, исторические и засекреченные места Узбекистана.">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="site-header">
    <nav class="navbar">
      <a href="/" class="navbar-brand">
        <div class="brand-icon">S</div>
        <span class="brand-name">STALK<span>ER</span></span>
      </a>

      <div class="navbar-nav">
        <a href="/" class="nav-link">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6-10l6-3m6 13l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-1.447-.894L15 9m0 8V9"/></svg>
          Карта
        </a>
        <a href="/catalog.html" class="nav-link">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Каталог
        </a>
        <a href="/admin.html" class="nav-link" id="nav-admin" style="display:none;">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Модерация
        </a>
      </div>

      <div class="navbar-actions">
        <a href="/auth.html" class="btn btn-ghost btn-sm" id="btn-login" style="display:none;">Войти</a>
        <a href="/auth.html" class="btn btn-primary btn-sm" id="btn-register" style="display:none;">Регистрация</a>
        <div class="dropdown" id="user-dropdown" style="display:none;">
          <button class="avatar-btn" id="avatar-trigger" aria-label="Меню пользователя">
            <span id="avatar-letter">U</span>
          </button>
          <div class="dropdown-menu" id="user-menu">
            <div style="padding: 12px 16px; border-bottom: 1px solid var(--border);">
              <div style="font-size:var(--text-sm); font-weight:600; color:var(--text-primary);" id="menu-username">Пользователь</div>
              <div style="font-size:var(--text-xs); color:var(--text-tertiary); margin-top:2px;" id="menu-role">Следопыт</div>
            </div>
            <button class="dropdown-item danger" id="btn-logout">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Выйти
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- PAGE -->
  <div class="page-wrapper">
    <main id="location-main" class="container location-page" role="main">

      <!-- Loading state -->
      <div class="empty-state" id="location-loading">
        <div class="loading-spinner"></div>
      </div>

      <!-- Error state -->
      <div class="empty-state" id="location-error" style="display:none;">
        <div class="empty-state-icon">🗃️</div>
        <div class="empty-state-title">Досье не найдено</div>
        <div class="empty-state-desc">Объект не существует или был удалён из базы</div>
        <a href="/catalog.html" class="btn btn-primary" style="margin-top:var(--sp-4);">Перейти в каталог</a>
      </div>

      <!-- Content (filled by JS) -->
      <div id="location-content" style="display:none;"></div>

    </main>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="/js/data.js"></script>
  <script src="/js/location.js"></script>
</body>
</html>
