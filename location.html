<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Объект — STALKER</title>
  <meta name="description" content="Подробное досье объекта на карте STALKER — заброшенные, исторические и засекреченные места Узбекистана.">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="site-header">
    <nav class="navbar">
      <a href="/" class="navbar-brand">
        <div class="brand-icon">S</div>
        <span class="brand-name">STALK<span>ER</span></span>
      </a>

      <div class="navbar-nav">
        <a href="/" class="nav-link">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6-10l6-3m6 13l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-1.447-.894L15 9m0 8V9"/></svg>
          Карта
        </a>
        <a href="/catalog.html" class="nav-link">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Каталог
        </a>
        <a href="/admin.html" class="nav-link" id="nav-admin" style="display:none;">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Модерация
        </a>
      </div>

      <div class="navbar-actions">
        <a href="/auth.html" class="btn btn-ghost btn-sm" id="btn-login" style="display:none;">Войти</a>
        <a href="/auth.html" class="btn btn-primary btn-sm" id="btn-register" style="display:none;">Регистрация</a>
        <div class="dropdown" id="user-dropdown" style="display:none;">
          <button class="avatar-btn" id="avatar-trigger" aria-label="Меню пользователя">
            <span id="avatar-letter">U</span>
          </button>
          <div class="dropdown-menu" id="user-menu">
            <div style="padding: 12px 16px; border-bottom: 1px solid var(--border);">
              <div style="font-size:var(--text-sm); font-weight:600; color:var(--text-primary);" id="menu-username">Пользователь</div>
              <div style="font-size:var(--text-xs); color:var(--text-tertiary); margin-top:2px;" id="menu-role">Следопыт</div>
            </div>
            <button class="dropdown-item danger" id="btn-logout">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Выйти
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile Hamburger Button -->
      <button class="burger-btn" id="burger-toggle-btn" aria-label="Меню навигации">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </header>

  <!-- Mobile Navigation Drawer -->
  <div class="mobile-drawer-backdrop" id="mobile-drawer-backdrop"></div>
  <aside class="mobile-nav-drawer" id="mobile-nav-drawer" aria-label="Мобильное меню">
    <div class="mobile-drawer-header">
      <a href="/" class="navbar-brand">
        <div class="brand-icon">S</div>
        <span class="brand-name">STALK<span>ER</span></span>
      </a>
      <button class="mobile-drawer-close" id="mobile-drawer-close" aria-label="Закрыть меню">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="mobile-drawer-user" id="mobile-drawer-user">
      <!-- Injected by JS -->
    </div>

    <nav class="mobile-drawer-nav">
      <a href="/" class="mobile-nav-link" id="mob-nav-map">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6-10l6-3m6 13l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-1.447-.894L15 9m0 8V9"/></svg>
        <span>Карта объектов</span>
      </a>
      <a href="/catalog.html" class="mobile-nav-link" id="mob-nav-catalog">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Каталог локаций</span>
      </a>
      <a href="/submit.html" class="mobile-nav-link" id="mob-nav-submit">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Добавить объект</span>
      </a>
      <a href="/admin.html" class="mobile-nav-link" id="mob-nav-admin" style="display:none;">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Модерация и Радар</span>
        <span class="badge accent" style="margin-left:auto; font-size:10px;">СБ</span>
      </a>
    </nav>

    <div class="mobile-drawer-footer" id="mobile-drawer-footer">
      <!-- Injected by JS -->
    </div>
  </aside>

  <!-- PAGE -->
  <div class="page-wrapper">
    <main id="location-main" class="container location-page" role="main">

      <!-- Loading state -->
      <div class="empty-state" id="location-loading">
        <div class="loading-spinner"></div>
      </div>

      <!-- Error state -->
      <div class="empty-state" id="location-error" style="display:none;">
        <div class="empty-state-icon">🗃️</div>
        <div class="empty-state-title">Досье не найдено</div>
        <div class="empty-state-desc">Объект не существует или был удалён из базы</div>
        <a href="/catalog.html" class="btn btn-primary" style="margin-top:var(--sp-4);">Перейти в каталог</a>
      </div>

      <!-- Content (filled by JS) -->
      <div id="location-content" style="display:none;"></div>

    </main>
  </div>

  <!-- Admin Edit Modal -->
  <div class="modal-backdrop" id="edit-loc-modal" role="dialog" aria-modal="true">
    <div class="modal" style="max-width: 620px;">
      <div class="modal-header">
        <h2 class="modal-title">Редактирование объекта</h2>
        <button class="modal-close" onclick="closeEditModal()" aria-label="Закрыть">×</button>
      </div>

      <div class="modal-body" style="max-height: 75vh; overflow-y: auto; display:flex; flex-direction:column; gap:var(--sp-4);">
        <div class="form-group">
          <label class="form-label" for="edit-name">Название</label>
          <input type="text" id="edit-name" class="input" required />
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3);">
          <div class="form-group">
            <label class="form-label" for="edit-type">Категория</label>
            <select id="edit-type" class="select">
              <option value="bunker">Бункер / ГО</option>
              <option value="abandoned">Заброшка</option>
              <option value="underground">Подземка</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-region">Регион</label>
            <input type="text" id="edit-region" class="input" required />
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3);">
          <div class="form-group">
            <label class="form-label" for="edit-lat">Широта (Lat)</label>
            <input type="number" step="0.0001" id="edit-lat" class="input" />
          </div>
          <div class="form-group">
            <label class="form-label" for="edit-lng">Долгота (Lng)</label>
            <input type="number" step="0.0001" id="edit-lng" class="input" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-icon">Иконка</label>
          <select id="edit-icon" class="select">
            <option value="bunker">🛡️ Бункер / Убежище</option>
            <option value="radiation">☢️ Радиация / Опасно</option>
            <option value="industrial">🏭 Завод / Промзона</option>
            <option value="building">🏢 Здание / Заброшка</option>
            <option value="underground">🚇 Подземка / Тоннель</option>
            <option value="military">🔬 Военный / Секретный</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-color">Цвет маркера</label>
          <select id="edit-color" class="select">
            <option value="#2563EB">🔵 Синий</option>
            <option value="#F59E0B">🟠 Оранжевый</option>
            <option value="#EF4444">🔴 Красный</option>
            <option value="#8B5CF6">🟣 Фиолетовый</option>
            <option value="#10B981">🟢 Изумрудный</option>
            <option value="#06B6D4">💠 Бирюзовый</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-difficulty">Сложность (1–5)</label>
          <input type="number" min="1" max="5" id="edit-difficulty" class="input" />
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-description">Описание</label>
          <textarea id="edit-description" class="textarea" style="min-height:90px;"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="edit-access">Способ доступа</label>
          <input type="text" id="edit-access" class="input" />
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeEditModal()">Отмена</button>
        <button class="btn btn-primary" id="btn-save-loc-edit" onclick="saveLocationEdit()">
          Сохранить изменения
        </button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script src="/js/data.js"></script>
  <script src="/js/location.js"></script>
</body>
</html>
